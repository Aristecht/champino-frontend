query FindAllProductsAdmin($filter: FilterProductInput) {
  findAllProductsAdmin(filter: $filter) {
    data {
      id
      name
      price
      discountedPrice
      stock
      isDraft
      isPublished
      category {
        id
        name
      }
      createdAt
    }
    meta {
      total
      page
      limit
      totalPages
    }
  }
}
