query FindAllProductsAdmin($filter: FilterProductInput) {
  findAllProductsAdmin(filter: $filter) {
    data {
      id
      name
      price
      discountedPrice
      stock
      isDraft
      isPublished
      medias {
        url
        mediaType
      }
      category {
        id
        name
        parent {
          id
          name
        }
      }
      createdAt
    }
    meta {
      total
      page
      limit
      totalPages
    }
  }
}
