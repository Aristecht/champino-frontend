query FindAllProducts($filter: FilterProductInput) {
  findAllProducts(filter: $filter) {
    data {
      id
      name
      price
      discountedPrice
      discountPercent
      stock
      isPublished
      category {
        id
        name
        slug
      }
      medias {
        id
        url
        mediaType
      }
    }
    meta {
      total
      page
      limit
      totalPages
    }
  }
}
