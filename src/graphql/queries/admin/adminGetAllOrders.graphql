query AdminGetAllOrders($filter: FilterOrderInput) {
  adminGetAllOrders(filter: $filter) {
    data {
      id
      status
      totalAmount
      discountAmount
      createdAt
      items {
        id
        quantity
        product {
          name
        }
      }
      shipping {
        fullName
        phone
        city
        deliveryType
      }
      payment {
        status
        method
      }
    }
    total
    page
    limit
  }
}
